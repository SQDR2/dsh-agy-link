name: Publish

# Push a tag like v0.6.0 (must match the package.json version) to publish.
# Pushing to main never publishes; only a v* tag or a manual run does.
# Manual run with dry_run=true installs, builds, tests and packs only (nothing is published).
# A version that is already on npm is skipped, so re-running a tag is safe.
#
# Auth: npm Trusted Publishing over OIDC. No long-lived token exists anywhere.
# Requires `permissions: id-token: write` below and a trusted publisher on the
# package's npm settings page pointing at this repository + publish.yml.
# A published version gets a provenance attestation recording the commit it was
# built from. See RELEASING.md.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (nothing is published)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then echo "tag v$TAG != package.json $PKG"; exit 1; fi

      - run: npm ci

      - run: npm run check

      # build before test: the MCP bridge E2E test spawns dist/bridge.mjs
      - run: npm run build

      - run: npm test

      # dist/ is gitignored and rebuilt by prepack, so npm publish builds it again.
      - name: Publish
        run: |
          npm install -g npm@latest
          # Fail fast and legibly if OIDC was not granted, instead of surfacing
          # it as an opaque 404/ENEEDAUTH from npm publish after a full build.
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL" || { echo "no OIDC token endpoint - is id-token: write set?"; exit 1; }
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          # A scoped name must be percent-encoded in the registry URL: @scope%2fname
          ENCODED=$(node -p "require('./package.json').name.replace('/','%2f')")
          if node -e "fetch('https://registry.npmjs.org/'+process.argv[1]).then(r=>r.json()).then(j=>process.exit(j.versions&&j.versions[process.argv[2]]?0:1),()=>process.exit(1))" "$ENCODED" "$VER"; then
            echo "$NAME@$VER is already on npm - not publishing"
            if [ "$DRY_RUN" = "true" ]; then npm pack --dry-run; fi
          elif [ "$DRY_RUN" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi
