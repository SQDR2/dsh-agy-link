name: Publish

# Push a tag like v0.6.0 (must match the package.json version) to publish.
# Pushing to main never publishes; only a v* tag or a manual run does.
# Manual run with dry_run=true installs, builds, tests and packs only (nothing is published).
# A version that is already on npm is skipped, so re-running a tag is safe.
#
# Auth: the NPM_TOKEN repository secret (granular token, packages: all,
# read+write, bypass 2FA). Trusted Publishing over OIDC is the intended end
# state -- `permissions: id-token: write` is already granted -- but it can only
# be configured on the package's npm settings page in a browser, and this
# account has no authenticator app, so `npm trust` fails with EOTP.
# See RELEASING.md for both the current setup and the switch-over steps.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (nothing is published)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          always-auth: true

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then echo "tag v$TAG != package.json $PKG"; exit 1; fi

      - run: npm ci

      - run: npm run check

      # build before test: the MCP bridge E2E test spawns dist/bridge.mjs
      - run: npm run build

      - run: npm test

      # dist/ is gitignored and rebuilt by prepack, so npm publish builds it again.
      #
      # Auth: NPM_TOKEN is a granular token (packages: all, read+write, bypass
      # 2FA) stored as a repository secret. It is the working path today.
      # Preferred end state is Trusted Publishing (OIDC, no token at all): add a
      # trusted publisher for this repo + publish.yml on the package's npm
      # settings page, then delete this `env:` block and the NPM_TOKEN secret.
      # `permissions: id-token: write` above is already in place for that.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@latest
          # Fail fast and legibly if the token is missing, expired or revoked,
          # instead of surfacing it as a confusing 401 from npm publish.
          npm whoami
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          # A scoped name must be percent-encoded in the registry URL: @scope%2fname
          ENCODED=$(node -p "require('./package.json').name.replace('/','%2f')")
          if node -e "fetch('https://registry.npmjs.org/'+process.argv[1]).then(r=>r.json()).then(j=>process.exit(j.versions&&j.versions[process.argv[2]]?0:1),()=>process.exit(1))" "$ENCODED" "$VER"; then
            echo "$NAME@$VER is already on npm - not publishing"
            if [ "$DRY_RUN" = "true" ]; then npm pack --dry-run; fi
          elif [ "$DRY_RUN" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi
